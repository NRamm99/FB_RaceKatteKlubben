<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/events.css}">
    <meta charset="UTF-8">
    <title>Rediger begivenhed</title>
</head>
<body>
<section class="banner-container">
    <nav class="app-nav">
        <a th:href="@{/profile}" class="app-nav-brand">RaceKatteKlubben</a>
        <div class="app-nav-links">
            <a th:href="@{/profile}" class="btn">Profil</a>
            <a th:href="@{/search}" class="btn">Søg</a>
            <a th:href="@{/pets/create}" class="btn">Tilføj kat</a>
            <a th:href="@{/pets/all}" class="btn">Alle katte</a>
            <a th:href="@{/events}" class="btn">Begivenheder</a>
            <form class="app-nav-logout" th:action="@{/logout}" method="post">
                <button class="btn" type="submit">Log ud</button>
            </form>
        </div>
    </nav>

    <img th:src="@{/images/FrontCat.png}" alt="Kat">

    <div class="login-wrapper">
        <form th:action="@{/events/{eventId}/edit(eventId=${event.id})}" method="post" class="login-form event-create-form">
            <h1 class="title">Rediger begivenhed</h1>

            <label class="label" for="title">Titel</label>
            <input class="field event-field" id="title" type="text" name="title" th:value="${event.title}" required>

            <label class="label" for="description">Beskrivelse</label>
            <textarea class="field event-field event-textarea" id="description" name="description" required th:text="${event.description}"></textarea>

            <label class="label" for="dateTime">Dato og tidspunkt</label>
            <input class="field event-field"
                   id="dateTime"
                   type="datetime-local"
                   name="dateTime"
                   th:value="${#temporals.format(event.dateTime, 'yyyy-MM-dd''T''HH:mm')}"
                   required>

            <button class="btn event-submit" type="submit">Gem ændringer</button>

            <p th:if="${param.error}" class="event-message event-error">Kunne ikke opdatere begivenheden.</p>

            <a th:href="@{/events}" class="btn">Tilbage</a>
        </form>
    </div>
</section>
</body>
</html>
