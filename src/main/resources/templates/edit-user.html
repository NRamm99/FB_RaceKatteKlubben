<!DOCTYPE html>
<html lang="da">
<head>
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/forms.css}">
  <meta charset="UTF-8">
  <title>Rediger bruger</title>
</head>
<body>

<section class="banner-container">
  <nav class="app-nav">
    <a th:href="@{/profile}" class="app-nav-brand">RaceKatteKlubben</a>
    <div class="app-nav-links">
      <a th:href="@{/profile}" class="btn">Profil</a>
      <a th:href="@{/search}" class="btn">Søg</a>
      <a th:href="@{/pets/all}" class="btn">Alle katte</a>
      <a th:href="@{/events}" class="btn">Begivenheder</a>
      <form class="app-nav-logout" th:action="@{/logout}" method="post">
        <button class="btn" type="submit">Log ud</button>
      </form>
    </div>
  </nav>

  <img th:src="@{/images/FrontCat.png}" alt="Kat">

  <div class="login-wrapper">
    <form th:action="@{/profile/edit}" method="post" class="login-form">
      <h1 class="title">Rediger bruger</h1>

      <p th:if="${error}" style="color:red;" th:text="${error}"></p>

      <label class="label" for="username">Brugernavn</label>
      <input class="field" id="username" type="text" name="username"
             th:value="${user.username}" required>

      <label class="label" for="email">E-mail</label>
      <input class="field" id="email" type="email" name="email"
             th:value="${user.email}" required>

      <button class="loginbtn" type="submit">Gem</button>
      <a th:href="@{/profile}" class="btn">Annuller</a>
    </form>
  </div>
</section>

</body>
</html>
