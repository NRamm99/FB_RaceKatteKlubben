<!DOCTYPE html>
<html lang="da">
<head>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <meta charset="UTF-8">
    <title>Rediger kat</title>
</head>
<body>

<section class="banner-container">
    <nav class="app-nav">
        <a th:href="@{/profile}" class="app-nav-brand">RaceKatteKlubben</a>
        <div class="app-nav-links">
            <a th:href="@{/profile}" class="btn">Profil</a>
            <a th:href="@{/search}" class="btn">Søg</a>
            <a th:href="@{/pets/all}" class="btn">Alle katte</a>
            <a th:href="@{/events}" class="btn">Begivenheder</a>
            <form class="app-nav-logout" th:action="@{/logout}" method="post">
                <button class="btn" type="submit">Log ud</button>
            </form>
        </div>
    </nav>

    <img th:src="@{/images/FrontCat.png}" alt="Kat">

    <div class="login-wrapper">
        <form th:action="@{/pets/edit-pet}" method="post" class="login-form" th:object="${pet}" novalidate>
            <h1 class="title">Rediger kat</h1>

            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{id}">

            <label class="label" for="name">Kattens navn</label>
            <input class="field" id="name" type="text" th:field="*{name}">

            <label class="label" for="race">Race</label>
            <select class="field" id="race" th:field="*{race}">
                <option th:each="race : ${races}" th:value="${race.name()}" th:text="${race.displayName}"></option>
            </select>

            <button class="loginbtn" type="submit">Gem ændringer</button>

            <p th:if="${error}" style="color:red;" th:text="${error}"></p>

            <a th:href="@{/profile}" class="btn">Tilbage til profil</a>
        </form>
    </div>
</section>

</body>
</html>
