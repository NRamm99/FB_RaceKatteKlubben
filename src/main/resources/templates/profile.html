<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <meta charset="UTF-8">
    <title>Profile</title>
</head>
<body>

<section class="banner-container">
    <img th:src="@{/images/FrontCat.png}" alt="Fluffy cat">

    <div class="login-wrapper">
        <div class="login-form">
            <h1 class="title">Profile</h1>

            <div class="profile-header">
                <!-- User info -->
                <div class="profile-info">
                    <!-- Username -->
                    <p class="field" th:text="'Username: ' + ${user.username}"></p>

                    <!-- Email -->
                    <p class="field" th:text="'Email: ' + ${user.email}"></p>
                </div>

                <div class="profile-account-actions">
                    <a th:href="@{/profile/edit}" class="btn">Edit user</a>
                    <a th:href="@{/profile/change-password}" class="btn">Change password</a>
                </div>
            </div>

            <!-- Cats -->
            <h2 class="section-title">Mine katte</h2>

            <div th:if="${#lists.isEmpty(pets)}" class="upcoming-events-empty">
                <p class="field">You have no cats yet.</p>
                <a th:href="@{/pets/create}" class="btn">Add cat</a>
            </div>

            <div th:if="${!#lists.isEmpty(pets)}" class="upcoming-events-list">
                <div th:each="pet : ${pets}" class="upcoming-event-card">
                    <p class="cat-line" th:text="'Name: ' + ${pet.name}"></p>
                    <p class="cat-line" th:text="'Race: ' + ${pet.race}"></p>
                </div>
            </div>

            <!-- Events -->
            <h2 class="section-title">Kommende begivenheder</h2>

            <div th:if="${#lists.isEmpty(upcomingEvents)}" class="upcoming-events-empty">
                <p class="field">Du har ingen kommende begivenheder</p>
                <a th:href="@{/events}" class="btn">Find begivenheder</a>
            </div>

            <div th:if="${!#lists.isEmpty(upcomingEvents)}" class="upcoming-events-list">
                <div th:each="event : ${upcomingEvents}" class="upcoming-event-card">
                    <p class="cat-line" th:text="${event.title}"></p>
                    <p class="cat-line"
                       th:text="${#temporals.format(event.dateTime, 'dd MMM yyyy HH:mm')}"></p>
                    <p class="cat-line" th:text="${event.description}"></p>
                </div>
            </div>

            <!-- Buttons -->
            <div class="profile-buttons">
                <a th:href="@{/pets/create}" class="btn">Add cat</a>
                <a th:href="@{/events}" class="btn">Events</a>

                <form th:action="@{/logout}" method="post">
                    <button class="btn" type="submit">Log out</button>
                </form>
            </div>
        </div>
    </div>

</section>

</body>
</html>
