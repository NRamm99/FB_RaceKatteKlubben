<!DOCTYPE html>
<html lang="da">
<head>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <meta charset="UTF-8">
    <title>Profil</title>
</head>
<body>

<section class="banner-container">
    <nav class="app-nav">
        <a th:href="@{/profile}" class="app-nav-brand">RaceKatteKlubben</a>
        <div class="app-nav-links">
            <a th:href="@{/profile}" class="btn">Profil</a>
            <a th:href="@{/search}" class="btn">Søg</a>
            <a th:href="@{/pets/create}" class="btn">Tilføj kat</a>
            <a th:href="@{/pets/all}" class="btn">Alle katte</a>
            <a th:href="@{/events}" class="btn">Begivenheder</a>
            <form class="app-nav-logout" th:action="@{/logout}" method="post">
                <button class="btn" type="submit">Log ud</button>
            </form>
        </div>
    </nav>

    <img th:src="@{/images/FrontCat.png}" alt="Kat">

    <div class="login-wrapper">
        <div class="login-form">
            <h1 class="title">Profil</h1>

            <div class="profile-header">
                <div class="profile-info">
                    <p class="field" th:text="'Brugernavn: ' + ${user.username}"></p>
                    <p class="field" th:text="'E-mail: ' + ${user.email}"></p>
                </div>

                <div class="profile-account-actions">
                    <a th:href="@{/profile/edit}" class="btn">Rediger bruger</a>
                    <a th:href="@{/profile/change-password}" class="btn">Skift adgangskode</a>
                    <form th:action="@{/profile/delete}" method="post">
                        <button class="btn" type="submit">Slet konto</button>
                    </form>
                </div>
            </div>

            <h2 class="section-title">Mine katte</h2>

            <div th:if="${#lists.isEmpty(pets)}" class="upcoming-events-empty">
                <p class="field">Du har ingen katte endnu.</p>
                <a th:href="@{/pets/create}" class="btn">Tilføj kat</a>
            </div>

            <div th:if="${!#lists.isEmpty(pets)}" class="upcoming-events-list">
                <div th:each="pet : ${pets}" class="upcoming-event-card">
                    <p class="cat-line" th:text="'Navn: ' + ${pet.name}"></p>
                    <p class="cat-line" th:text="'Race: ' + ${pet.race.displayName}"></p>
                    <a class="btn" th:href="@{/pets/edit-pet(id=${pet.id})}">Rediger kat</a>
                    <form th:action="@{/pets/delete}" method="post">
                        <input type="hidden" name="id" th:value="${pet.id}">
                        <button class="btn" type="submit">Slet kat</button>
                    </form>
                </div>
            </div>

            <h2 class="section-title">Kommende begivenheder</h2>

            <div th:if="${#lists.isEmpty(upcomingEvents)}" class="upcoming-events-empty">
                <p class="field">Du har ingen kommende begivenheder</p>
                <a th:href="@{/events}" class="btn">Find begivenheder</a>
            </div>

            <div th:if="${!#lists.isEmpty(upcomingEvents)}" class="upcoming-events-list">
                <div th:each="event : ${upcomingEvents}" class="upcoming-event-card">
                    <p class="cat-line" th:text="${event.title}"></p>
                    <p class="cat-line"
                       th:text="${#temporals.format(event.dateTime, 'dd MMM yyyy HH:mm')}"></p>
                    <p class="cat-line" th:text="${event.description}"></p>
                </div>
            </div>

        </div>
    </div>

</section>

</body>
</html>
