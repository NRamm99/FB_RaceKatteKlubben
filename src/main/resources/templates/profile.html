<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <title>Profile</title>
</head>
<body>

<section class="banner-container">
    <img th:src="@{/images/FrontCat.png}" alt="Fluffy cat">

    <div class="login-wrapper">
        <div class="login-form">
            <h1 class="title">Profile</h1>

            <!-- User info -->
            <div class="profile-info">
                <!-- Username -->
                <p class="field" th:text="'Username: ' + ${user.username}"></p>

                <!-- Email -->
                <p class="field" th:text="'Email: ' + ${user.email}"></p>
            </div>

            <!-- Cats -->
            <label class="label">My cats:</label>

            <div th:if="${#lists.isEmpty(pets)}">
                <p class="field">You have no cats yet.</p>
            </div>

            <div th:if="${!#lists.isEmpty(pets)}" class="cats-container">
                <div th:each="pet : ${pets}" class="cat-card">
                    <p class="cat-line" th:text="'Name: ' + ${pet.name}"></p>
                    <p class="cat-line" th:text="'Race: ' + ${pet.race}"></p>
                </div>
            </div>

            <!-- Buttons -->
            <div class="profile-buttons">
                <a th:href="@{/pets/create}" class="btn">Add cat</a>

                <form th:action="@{/logout}" method="post">
                    <button class="btn" type="submit">Log out</button>
                </form>
            </div>
        </div>
    </div>

</section>

</body>
</html>
