<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/forms.css}">
  <meta charset="UTF-8">
  <title>Change password</title>
</head>
<body>

<section class="banner-container">
  <img th:src="@{/images/FrontCat.png}" alt="Fluffy cat">

  <div class="login-wrapper">
    <form th:action="@{/profile/change-password}" method="post" class="login-form">
      <h1 class="title">Change password</h1>

      <!-- Error message -->
      <p th:if="${error}" style="color:red;" th:text="${error}"></p>

      <!-- Password fields -->
      <label class="label" for="oldPassword">Old password</label>
      <input class="field" id="oldPassword" type="password" name="oldPassword" required>

      <label class="label" for="newPassword">New password</label>
      <input class="field" id="newPassword" type="password" name="newPassword" required>

      <label class="label" for="repeatPassword">Repeat new password</label>
      <input class="field" id="repeatPassword" type="password" name="repeatPassword" required>

      <!-- Buttons -->
      <button class="loginbtn" type="submit">Save</button>
      <a th:href="@{/profile}" class="btn">Cancel</a>
    </form>
  </div>
</section>

</body>
</html>
