<!DOCTYPE html>
<html lang="da">
<head>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <meta charset="UTF-8">
    <title>Katteprofil</title>
</head>
<body>

<section class="banner-container">
    <nav class="app-nav">
        <a th:href="@{/profile}" class="app-nav-brand">RaceKatteKlubben</a>
        <div class="app-nav-links">
            <a th:href="@{/profile}" class="btn">Profil</a>
            <a th:href="@{/search}" class="btn">Søg</a>
            <a th:href="@{/pets/create}" class="btn">Tilføj kat</a>
            <a th:href="@{/pets/all}" class="btn">Alle katte</a>
            <a th:href="@{/events}" class="btn">Begivenheder</a>
            <form class="app-nav-logout" th:action="@{/logout}" method="post">
                <button class="btn" type="submit">Log ud</button>
            </form>
        </div>
    </nav>

    <img th:src="@{/images/FrontCat.png}" alt="Kat">

    <div class="login-wrapper">
        <div class="login-form">
            <h1 class="title">Katteprofil</h1>

            <div class="profile-info">
                <p class="field" th:text="'Navn: ' + ${pet.name}"></p>
                <p class="field" th:text="'Race: ' + ${pet.race.displayName}"></p>
                <p class="field" th:text="'Ejer: ' + ${owner.username}"></p>
            </div>

            <div class="profile-buttons">
                <a th:href="@{/users/{id}(id=${owner.id})}" class="btn">Se ejer</a>
                <a th:href="@{/search}" class="btn">Tilbage til søgning</a>
            </div>
        </div>
    </div>
</section>

</body>
</html>
